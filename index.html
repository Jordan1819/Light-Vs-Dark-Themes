<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Comprehension Quiz</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <div id="homePage">
        <h1 class="headerText">Reading Comprehension Quiz</h1>
        <p class="homeBodyText">Welcome to our short reading comprehension quiz.</p>
        <p class="homeBodyText">Your goal is to read the passage and answer the following multiple choice questions correctly as quickly as possible.</p>
        <button id="startQuizButton">Start Quiz</button>
    </div>
</body>
<script>
    document.getElementById('startQuizButton').onclick = function() {
        window.location.href = 'quiz.html';
    };
    function setTheme() {
        //Check if theme is already stored
        let theme = localStorage.getItem('selectedTheme');
        if (!theme) {
            // If no theme, randomly select & store theme
            theme = Math.random() < 0.5 ? 'light' : 'dark';
            localStorage.setItem('selectedTheme', theme);
        }
        // Set theme for this page
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `styles/${theme}.css`;
        document.head.appendChild(link);
    };
    document.addEventListener('DOMContentLoaded', setTheme);
</script>
</html>
